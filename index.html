/* ===================== TOKENS: identidade do Canis e do Laika (4Network) ===================== */

  --sel: oklch(0.966 0.024 128);

  --marca-texto: #1e2324;

  --marca-ativa: oklch(0.92 0.06 128);

  --foco: #5c8f22;

  --aviso: #b45309; --aviso-f: oklch(0.97 0.04 85); --aviso-b: oklch(0.86 0.09 80);

/* ===================== BASE ===================== */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 400 15px/1.55 var(--fonte); color: var(--tinta); background: var(--fundo); font-variant-numeric: tabular-nums; }
h1, h2, h3, h4, h5 { margin: 0; line-height: 1.25; letter-spacing: -0.01em; }
h1 { font-size: 1.6rem; font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 650; }
h3 { font-size: 1rem; font-weight: 650; margin: 18px 0 8px; }
h4 { font-size: .95rem; font-weight: 650; }
p { margin: 0 0 10px; }
a { color: var(--link); text-underline-offset: 2px; }
small { font-size: .82rem; }
b, strong { font-weight: 650; }
ul, ol { margin: 0 0 10px; padding-left: 20px; }
li { margin: 3px 0; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th { text-align: left; font-weight: 600; color: var(--cinza); background: var(--suave); }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--linha-suave); vertical-align: top; }
td.n, th.n { text-align: right; white-space: nowrap; }
tbody tr:last-child td, tbody tr:last-child th { border-bottom: 0; }
input, select, textarea, button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
.sr { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mudo { color: var(--cinza); }
.ico { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ico.p { width: 16px; height: 16px; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }

/* ===================== CASCA: barra lateral, topo do celular, conteúdo ===================== */
.app { display: grid; grid-template-columns: 252px minmax(0, 1fr); min-height: 100vh; }
.lateral { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--lateral); border-right: 1px solid var(--linha); display: flex; flex-direction: column; padding: 14px 10px 12px; gap: 6px; }
.lat-marca { display: flex; align-items: center; gap: 10px; padding: 4px 8px 12px; font-weight: 700; font-size: 1.12rem; }
.lat-marca svg { flex: none; }
.lat-marca .lat-fechar { margin-left: auto; display: none; }
.lat-marca .lat-recolher { margin-left: auto; color: var(--cinza); }
.lat-sub .ico { display: none; }
.lat-nav { display: flex; flex-direction: column; gap: 2px; }
.lat-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: var(--raio-p); color: var(--tinta); text-decoration: none; font-weight: 500; font-size: .95rem; border: 0; background: none; width: 100%; text-align: left; cursor: pointer; }
.lat-item:hover { background: var(--hover); }
.lat-item[aria-current="page"] { background: var(--marca-ativa); font-weight: 600; }
.lat-item .lat-n { margin-left: auto; font-size: .78rem; color: var(--cinza); font-weight: 500; }
.lat-item .ponto, .lat-sub .ponto { width: 7px; height: 7px; border-radius: 50%; background: var(--aviso-b); margin-left: auto; flex: none; }
.lat-sub { display: flex; align-items: center; gap: 8px; margin: 0 0 2px 28px; padding: 5px 10px; border-radius: var(--raio-p); color: var(--cinza); text-decoration: none; font-size: .88rem; border-left: 2px solid var(--linha-forte); border-top-left-radius: 0; border-bottom-left-radius: 0; }
.lat-sub span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lat-sub:hover { background: var(--hover); color: var(--tinta); }
.lat-sub[aria-current="page"] { color: var(--tinta); font-weight: 600; border-left-color: var(--marca); }
.lat-sep { height: 1px; background: var(--linha); margin: 10px 8px; }
.lat-grupo { font-size: .78rem; color: var(--cinza); padding: 2px 10px 4px; }
.lat-pe { margin-top: auto; display: flex; flex-direction: column; gap: 2px; border-top: 1px solid var(--linha); padding-top: 8px; }
.lat-pe .lat-item { font-size: .88rem; color: var(--cinza); }
.lat-dados { font-size: .8rem; color: var(--cinza); padding: 4px 10px 2px; line-height: 1.4; }
.lat-dados.atencao { color: var(--aviso); }
.topo-movel { display: none; position: sticky; top: 0; z-index: 30; align-items: center; gap: 8px; padding: 8px 12px; background: var(--fundo); border-bottom: 1px solid var(--linha); min-height: 52px; }
.topo-movel .tm-tit { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.principal { min-width: 0; }
#app { max-width: 1280px; margin: 0 auto; padding: 28px 36px 72px; outline: none; }
.veu-menu { display: none; }
@media (min-width: 961px) {
  .app { transition: grid-template-columns var(--dur) ease; }
  [data-lateral="recolhida"] .app { grid-template-columns: 64px minmax(0, 1fr); }
  [data-lateral="recolhida"] .lateral { padding-inline: 8px; overflow-x: hidden; }
  [data-lateral="recolhida"] .lateral .rot { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  [data-lateral="recolhida"] .lat-marca { flex-direction: column; gap: 10px; padding: 4px 0 10px; }
  [data-lateral="recolhida"] .lat-marca .lat-recolher { margin: 0; }
  [data-lateral="recolhida"] .lat-item, [data-lateral="recolhida"] .lat-sub { position: relative; justify-content: center; padding: 9px 0; margin: 0; border-left: 0; border-radius: var(--raio-p); }
  [data-lateral="recolhida"] .lat-sub .ico { display: block; }
  [data-lateral="recolhida"] .lat-sub[aria-current="page"] { background: var(--marca-ativa); }
  [data-lateral="recolhida"] .lat-n, [data-lateral="recolhida"] .lat-dados { display: none; }
  [data-lateral="recolhida"] .ponto { position: absolute; top: 6px; right: 9px; margin: 0; }
  [data-lateral="recolhida"] .lat-sep { margin-inline: 4px; }
}
.aviso-armaz { background: var(--aviso-f); color: var(--aviso); border-bottom: 1px solid var(--aviso-b); padding: 8px 36px; font-size: .9rem; }
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .lateral { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); z-index: 60; transform: translateX(-102%); transition: transform var(--dur) ease; box-shadow: var(--sombra-g); }
  .app.menu-aberto .lateral { transform: none; }
  .app.menu-aberto .veu-menu { display: block; position: fixed; inset: 0; background: var(--veu); z-index: 55; }
  .lat-marca .lat-fechar { display: inline-flex; }
  .lat-marca .lat-recolher { display: none; }
  .topo-movel { display: flex; }
  :root { --topo-fixo: 52px; }
  #app { padding: 18px 16px 64px; }
  .aviso-armaz { padding: 8px 16px; }
}

/* ===================== CONTROLES ===================== */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: var(--alt); padding: 6px 14px; border-radius: var(--raio-p); border: 1px solid var(--linha-forte); background: var(--superficie); color: var(--tinta); font-weight: 550; font-size: .92rem; cursor: pointer; text-decoration: none; white-space: nowrap; transition: background var(--dur), border-color var(--dur); }
.btn:hover { background: var(--suave); }
.btn:disabled, .btn[aria-disabled="true"] { opacity: .5; cursor: default; }
.btn.prim { background: var(--marca); border-color: var(--marca); color: var(--marca-texto); }
.btn.prim:hover:not(:disabled) { background: oklch(0.72 0.17 128); border-color: oklch(0.72 0.17 128); }
.btn.fant { border-color: transparent; background: none; }
.btn.fant:hover { background: var(--hover); }
.btn.perigo { color: var(--crit); }
.btn.perigo-forte { background: var(--crit-forte); border-color: var(--crit-forte); color: #fff; }
.btn.peq { min-height: 30px; padding: 3px 10px; font-size: .86rem; }
.btn.ico-so { padding: 6px; width: var(--alt); }
.btn.peq.ico-so { width: 30px; padding: 4px; }
.link-btn { background: none; border: 0; padding: 0; color: var(--link); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; font: inherit; }
.link-btn.perigo { color: var(--crit); }
.acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
input[type="text"], input[type="search"], input:not([type]), select, textarea { width: 100%; height: var(--alt); padding: 7px 11px; border: 1px solid var(--cinza2); border-radius: var(--raio-p); background: var(--superficie); transition: border-color var(--dur), box-shadow var(--dur); }
/* lista sem a aparência do sistema, para ter a altura dos campos; a seta é desenhada com a cor do texto */
select { appearance: none; -webkit-appearance: none; padding-right: 34px; text-overflow: ellipsis; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, var(--cinza) 50%), linear-gradient(135deg, var(--cinza) 50%, transparent 50%);
  background-position: calc(100% - 18px) 52%, calc(100% - 13px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
select:disabled { cursor: not-allowed; opacity: .6; }
textarea { height: auto; min-height: 120px; resize: vertical; line-height: 1.5; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--foco); box-shadow: 0 0 0 3px oklch(0.75 0.15 128 / 0.35); }
input::placeholder { color: var(--cinza); opacity: .75; }
input[type="checkbox"], input[type="radio"] { accent-color: var(--acento); width: 16px; height: 16px; margin: 0; flex: none; }
.chk-linha { display: inline-flex; align-items: flex-start; gap: 9px; cursor: pointer; font-size: .93rem; }
.chk-linha input { margin-top: 3px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: var(--raio); background: var(--suave); border: 1px solid var(--linha); flex-wrap: wrap; }
.seg-op { position: relative; display: inline-flex; }
.seg-op input { position: absolute; opacity: 0; inset: 0; cursor: pointer; width: 100%; height: 100%; margin: 0; }
.seg-op span { display: inline-flex; align-items: center; min-height: calc(var(--alt) - 8px); padding: 0 12px; border-radius: var(--raio-p); font-size: .88rem; font-weight: 550; color: var(--cinza); white-space: nowrap; }
.seg-op input:checked + span { background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-p); }
.seg-op input:focus-visible + span { outline: 2px solid var(--foco); outline-offset: 1px; }
.seg-op.off span { opacity: .45; }
.seg-op.off input { cursor: not-allowed; }

/* selos, chips e estados */
.selo { display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; font-weight: 600; padding: 1px 7px; border-radius: 999px; background: var(--suave); color: var(--cinza); border: 1px solid var(--linha); vertical-align: middle; white-space: nowrap; }
.selo.cnpj { background: var(--info-f); color: var(--info); border-color: var(--info-b); }
.selo.oficial, .selo.ok { background: var(--ok-f); color: var(--ok); border-color: var(--ok-b); }
.selo.agregador { background: var(--marca-f); color: var(--link); border-color: var(--marca-b); }
.selo.aprox, .selo.pend { background: var(--aviso-f); color: var(--aviso); border-color: var(--aviso-b); }
.estado { display: inline-flex; align-items: center; gap: 7px; font-size: .86rem; color: var(--cinza); white-space: nowrap; }
.estado i { width: 8px; height: 8px; border-radius: 50%; background: var(--cinza2); }
.estado.ok i { background: var(--ok); }
.estado.pend i, .estado.novo i { background: var(--aviso-b); }
.estado.pend { color: var(--aviso); }
.estado.erro { color: var(--crit); }
.estado.erro i { background: var(--crit); }
.conf { display: inline-flex; align-items: center; gap: 6px; font-size: .84rem; font-weight: 600; white-space: nowrap; padding: 2px 9px 2px 7px; border-radius: 999px; border: 1px solid; }
.conf .ico { width: 14px; height: 14px; }
.conf.c-alta { color: var(--ok); background: var(--ok-f); border-color: var(--ok-b); }
.conf.c-media { color: var(--aviso); background: var(--aviso-f); border-color: var(--aviso-b); }
.conf.c-baixa { color: var(--crit); background: var(--crit-f); border-color: var(--crit-b); }
.chip-modo { display: inline-flex; align-items: center; font-size: .76rem; font-weight: 600; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--linha); color: var(--cinza); background: var(--suave); white-space: nowrap; }
.chip-modo.cal { color: var(--link); background: var(--marca-f); border-color: var(--marca-b); }
.chip-modo.minha { color: var(--info); background: var(--info-f); border-color: var(--info-b); }
.o-chip { display: inline-flex; align-items: center; gap: 5px; font-size: .8rem; font-weight: 550; white-space: nowrap; color: var(--cinza); }
.o-chip .ico { width: 15px; height: 15px; }
.o-oficial { color: var(--ok); } .o-agregador { color: var(--link); } .o-terceiros { color: var(--aviso); } .o-palpite { color: var(--crit); }
.o-enquadramento, .o-estimado, .o-combinada { color: var(--info); }

/* avisos e notas */
.alerta, .nota, .info-caixa { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: var(--raio-p); font-size: .9rem; margin: 10px 0 0; border: 1px solid; }
.alerta { background: var(--aviso-f); border-color: var(--aviso-b); color: var(--tinta); }
.alerta.critico { background: var(--crit-f); border-color: var(--crit-b); }
.info-caixa { background: var(--info-f); border-color: var(--info-b); }
.nota { background: var(--suave); border-color: var(--linha); color: var(--cinza); }
.alerta > .ico { color: var(--aviso); margin-top: 1px; } .info-caixa > .ico { color: var(--info); margin-top: 1px; }
.alerta p, .info-caixa p, .nota p { margin: 0; }
.dica { display: block; font-size: .84rem; color: var(--cinza); line-height: 1.45; }
.valid { font-size: .84rem; color: var(--crit); margin: 4px 0 0; min-height: 0; }
.valid:empty { display: none; }

/* ===================== CABEÇALHOS E BLOCOS ===================== */
.cab { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px 24px; flex-wrap: wrap; margin-bottom: 22px; }
.cab-txt { min-width: 0; max-width: 760px; }
.cab .sub { color: var(--cinza); margin: 6px 0 0; }
.painel { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 20px 22px; }
.painel + .painel { margin-top: 16px; }
.painel-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px 20px; flex-wrap: wrap; margin-bottom: 14px; }
.painel-cab p { color: var(--cinza); margin: 4px 0 0; font-size: .92rem; max-width: 720px; }
.painel-cab h2 { display: flex; align-items: center; gap: 9px; }
.painel-cab h2 .ico { color: var(--cinza); }
.tab-wrap { position: relative; overflow-x: auto; border: 1px solid var(--linha); border-radius: var(--raio); background: var(--superficie); }
.tab-wrap table { min-width: 100%; }
.tab-wrap + .tab-wrap { margin-top: 12px; }
.tab-rola { max-height: 560px; overflow: auto; }
.tab-rola thead th { position: sticky; top: 0; z-index: 1; }
details > summary { cursor: pointer; }
.dados-tab, .mais { margin-top: 12px; }
.dados-tab > summary, .mais > summary { font-size: .88rem; color: var(--link); font-weight: 550; }
.dados-tab .tab-wrap { margin-top: 10px; }
.vazio { text-align: center; padding: 48px 24px; border: 1px dashed var(--linha-forte); border-radius: var(--raio-g); background: var(--suave); }
.vazio h2 { margin-bottom: 8px; }
.vazio p { color: var(--cinza); max-width: 560px; margin: 0 auto 18px; }
.vazio .acoes { justify-content: center; }
.passos-vazio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 760px; margin: 0 auto 22px; text-align: left; counter-reset: passo; }
.passos-vazio li { list-style: none; background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); padding: 12px 14px; font-size: .9rem; color: var(--cinza); margin: 0; }
.passos-vazio li b { display: block; color: var(--tinta); margin-bottom: 2px; }
.passos-vazio { padding: 0; }
@media (max-width: 720px) { .passos-vazio { grid-template-columns: 1fr; } }

/* menus e janelinhas */
.menu-pop { position: fixed; z-index: 80; min-width: 200px; max-width: min(360px, calc(100vw - 16px)); background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio); box-shadow: var(--sombra-g); padding: 6px; }
.menu-pop .mi { display: flex; align-items: flex-start; gap: 10px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: var(--raio-p); text-align: left; cursor: pointer; font-size: .92rem; color: var(--tinta); text-decoration: none; }
.menu-pop .mi:hover, .menu-pop .mi:focus-visible { background: var(--hover); outline: none; }
.menu-pop .mi[aria-checked="true"] { background: var(--sel); }
.menu-pop .mi small { display: block; color: var(--cinza); font-size: .8rem; margin-top: 1px; line-height: 1.35; }
.menu-pop .mi .ico { margin-top: 2px; }
.menu-pop .mi.perigo { color: var(--crit); }
.menu-pop hr { border: 0; border-top: 1px solid var(--linha); margin: 6px 4px; }
.pop-ajuda { padding: 14px 16px; max-width: min(380px, calc(100vw - 16px)); }
.pop-ajuda h4 { margin: 0 0 6px; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.pop-ajuda p { font-size: .9rem; margin: 0 0 8px; }
.pop-ajuda ul { list-style: none; padding: 0; margin: 6px 0 0; display: flex; flex-direction: column; gap: 6px; }
.pop-ajuda li { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin: 0; font-size: .9rem; }
.pop-ajuda .pop-nota { color: var(--cinza); font-size: .8rem; margin: 8px 0 0; }
.pop-ajuda .lista-orig li { align-items: flex-start; justify-content: flex-start; }
.pop-ajuda .lista-orig b { display: block; }
.pop-ajuda .lista-orig span { font-size: .84rem; color: var(--cinza); }
.ajuda { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; border: 0; background: none; color: var(--cinza); cursor: pointer; padding: 0; flex: none; }
.ajuda:hover { background: var(--hover); color: var(--tinta); }
.ajuda .ico { width: 17px; height: 17px; }
.tip { position: fixed; z-index: 90; max-width: 300px; padding: 6px 9px; border-radius: var(--raio-p); background: var(--tinta); color: var(--fundo); font-size: .8rem; line-height: 1.4; pointer-events: none; opacity: 0; transition: opacity 120ms; }
.tip.show { opacity: 1; }
dialog#dlg { border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 0; width: min(560px, calc(100vw - 24px)); background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra-g); }
dialog#dlg.largo { width: min(880px, calc(100vw - 24px)); }
dialog#dlg::backdrop { background: var(--veu); }
#dlg-corpo { padding: 22px 24px 8px; max-height: calc(100vh - 160px); overflow: auto; }
#dlg-corpo h2 { margin-bottom: 10px; font-size: 1.2rem; }
#dlg-corpo p { color: var(--cinza); }
#dlg-acoes { display: flex; justify-content: flex-end; gap: 8px; padding: 14px 24px 20px; flex-wrap: wrap; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--tinta); color: var(--fundo); padding: 10px 16px; border-radius: var(--raio); font-size: .9rem; z-index: 95; opacity: 0; pointer-events: none; transition: opacity var(--dur), transform var(--dur); max-width: calc(100vw - 32px); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.passos { padding-left: 20px; color: var(--cinza); }
textarea.prompt { min-height: 260px; font-size: .88rem; }

/* ===================== EMPRESAS ===================== */
.barra-ferr { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
.barra-ferr .busca { flex: 1 1 260px; max-width: 380px; position: relative; }
.barra-ferr .busca .ico { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--cinza); pointer-events: none; }
.barra-ferr .busca input { padding-left: 36px; }
.barra-ferr select { width: auto; min-width: 150px; }
.barra-sel { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 8px 12px; border-radius: var(--raio); background: var(--sel); border: 1px solid var(--marca-b); margin-bottom: 12px; font-size: .9rem; }
.lista-emp td { vertical-align: middle; }
.lista-emp tbody tr:hover { background: var(--hover); }
.emp-nome { font-weight: 600; color: var(--tinta); text-decoration: none; }
.emp-nome:hover { text-decoration: underline; }
.emp-sub { font-size: .8rem; color: var(--cinza); margin-top: 1px; }
.emp-val { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.regua.mini-regua { display: block; width: 112px; height: 12px; }
.acoes-cel { width: 1%; white-space: nowrap; text-align: right; }
.ordenar { background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
.ordenar .ico { width: 14px; height: 14px; opacity: .6; }
.lembrete { display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--raio); background: var(--aviso-f); border: 1px solid var(--aviso-b); margin-bottom: 14px; font-size: .9rem; }
@media (max-width: 720px) {
  .lista-emp thead { display: none; }
  .lista-emp, .lista-emp tbody, .lista-emp tr, .lista-emp td { display: block; width: 100%; }
  .lista-emp tr { position: relative; padding: 12px 48px 12px 44px; border-bottom: 1px solid var(--linha-suave); }
  .lista-emp tbody tr:last-child { border-bottom: 0; }
  .lista-emp td { border: 0; padding: 2px 0; text-align: left !important; }
  .lista-emp td:first-child { position: absolute; left: 14px; top: 15px; width: auto; padding: 0; }
  .lista-emp td.acoes-cel { position: absolute; right: 8px; top: 8px; width: auto; }
  .lista-emp .emp-val { align-items: flex-start; flex-direction: row; flex-wrap: wrap; gap: 4px 10px; }
  .lista-emp td:empty { display: none; }
}
.paginas { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 10px; font-size: .88rem; color: var(--cinza); flex-wrap: wrap; }

/* ===================== ANÁLISE: área de trabalho ===================== */
.ws-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px 24px; flex-wrap: wrap; }
.ws-tit { min-width: 0; }
.ws-tit h1 { overflow-wrap: anywhere; }
.ws-meta { display: flex; gap: 8px 14px; flex-wrap: wrap; align-items: center; margin-top: 6px; color: var(--cinza); font-size: .9rem; }
.abas { display: flex; gap: 4px; border-bottom: 1px solid var(--linha); margin: 18px 0 22px; position: sticky; top: 0; z-index: 20; background: var(--fundo); }
.abas a { padding: 10px 14px; text-decoration: none; color: var(--cinza); font-weight: 550; border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; gap: 8px; align-items: center; }
.abas a:hover { color: var(--tinta); }
.abas a[aria-current="page"] { color: var(--tinta); border-bottom-color: var(--marca); }
@media (max-width: 960px) { .abas { top: 52px; } }
.ws-corpo { container: ws / inline-size; }
.grade-ws { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 22px; align-items: start; }
@container ws (min-width: 1040px) { .grade-ws { grid-template-columns: minmax(0, 1fr) 368px; gap: 28px; } }
.form-ws { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.secao-form { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 18px 20px 20px; scroll-margin-top: 70px; }

.sf-prog { font-size: .8rem; color: var(--cinza); white-space: nowrap; }
.sf-desc { color: var(--cinza); font-size: .88rem; margin: -8px 0 16px; }
.nota-modelo { display: flex; gap: 10px; align-items: flex-start; padding: 12px 16px; border: 1px solid var(--marca-b); border-radius: var(--raio-g); background: var(--marca-f); font-size: .9rem; }

.nota-modelo details { margin-top: 6px; }
.nota-modelo summary { cursor: pointer; color: var(--link); font-weight: 600; width: fit-content; }
.nota-modelo ul { margin: 6px 0 0; padding-left: 18px; color: var(--cinza); }
.nota-modelo li { margin: 4px 0; }
.vazio .vazio-modelo { margin: 18px auto 0; max-width: 560px; color: var(--cinza); font-size: .92rem; }
.objetivo .sf-cab { margin-bottom: 12px; }
.objetivo.pede { border-color: var(--marca-b); box-shadow: 0 0 0 3px var(--marca-f); }
.objetivo.pede .sf-prog { color: var(--link); font-weight: 600; }
.objetivos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.obj-op { display: flex; gap: 10px; align-items: flex-start; padding: 11px 13px; border: 1px solid var(--linha-forte); border-radius: var(--raio); background: var(--superficie); cursor: pointer; }
.obj-op input { margin-top: 3px; }
.obj-op b { display: block; font-size: .95rem; }
.obj-op small { display: block; color: var(--cinza); font-size: .8rem; line-height: 1.35; margin-top: 2px; }
.obj-op:hover { border-color: var(--cinza2); }
.obj-op:has(input:checked) { border-color: var(--marca-b); background: var(--marca-f); }
.obj-op:has(input:focus-visible) { outline: 2px solid var(--foco); outline-offset: 2px; }
.grade-campos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 20px; }
.grade-campos .largo { grid-column: 1 / -1; }
@container ws (max-width: 560px) { .grade-campos, .objetivos { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 640px) { .grade-campos { grid-template-columns: minmax(0, 1fr); } }
details.secao-form > summary { list-style: none; }
details.secao-form > summary::-webkit-details-marker { display: none; }
details.secao-form > summary .sf-cab { margin: 0; }
details.secao-form[open] > summary { margin-bottom: 12px; }
details.secao-form > summary .chev { transition: transform var(--dur); }
details.secao-form[open] > summary .chev { transform: rotate(180deg); }
.campo { min-width: 0; }
.campo-rot { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; min-height: 22px; }
.campo-rot label, .campo-rot .rot { font-weight: 600; font-size: .9rem; }
.campo-rot .ajuda { margin-left: auto; }
.entrada { position: relative; display: flex; align-items: center; }
.entrada .pre, .entrada .suf { position: absolute; top: 50%; transform: translateY(-50%); color: var(--cinza); font-size: .86rem; pointer-events: none; }
.entrada .pre { left: 11px; } .entrada .suf { right: 11px; }
.entrada.com-pre input { padding-left: 36px; }
.entrada.com-suf input { padding-right: 70px; }
.entrada.com-acao input { padding-right: 44px; }
.acao-dentro { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 32px; height: 32px; display: inline-grid; place-items: center; border: 0; border-radius: var(--raio-p); background: none; color: var(--cinza); cursor: pointer; }
.acao-dentro:hover { background: var(--hover); color: var(--tinta); }
.acao-dentro:disabled { cursor: progress; }
.acao-dentro[aria-busy="true"] .ico { animation: gira .9s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
.campo-pe { display: flex; align-items: center; gap: 6px 12px; flex-wrap: wrap; margin-top: 6px; }
.campo-pe:empty { display: none; }
.origem { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--linha); background: var(--suave); border-radius: 999px; padding: 1px 8px 1px 6px; font-size: .78rem; font-weight: 600; cursor: pointer; white-space: nowrap; min-height: 24px; }
.origem .ico { width: 14px; height: 14px; }
.origem .chev { width: 12px; height: 12px; opacity: .7; }
.origem:hover { border-color: var(--linha-forte); }
.origem.o-vazio { color: var(--cinza); background: none; border-style: dashed; border-color: var(--linha-forte); font-weight: 550; }
.campo .dica { margin-top: 0; }
.linha-dupla { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.linha-dupla .ano { display: inline-flex; align-items: center; gap: 6px; font-size: .88rem; color: var(--cinza); }
.linha-dupla .ano input { width: 86px; }
.sugestao, .dica-acao { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; padding: 10px 12px; border-radius: var(--raio-p); background: var(--info-f); border: 1px solid var(--info-b); font-size: .9rem; }
.sugestao > span, .dica-acao > span { flex: 1 1 220px; }
.dica-acao { background: var(--marca-f); border-color: var(--marca-b); }
.calc-caixa { margin-top: 10px; padding: 10px 12px; border-radius: var(--raio-p); background: var(--suave); border: 1px solid var(--linha); font-size: .88rem; }
.calc-caixa b { font-weight: 650; }
.calc-caixa small { display: block; color: var(--cinza); margin-top: 2px; }
.calc-caixa p { margin: 6px 0 0; color: var(--cinza); }
.rec-global { margin-top: 12px; padding: 14px; border: 1px dashed var(--linha-forte); border-radius: var(--raio); display: grid; gap: 14px; }
.rec-global h4 { display: flex; gap: 8px; align-items: center; }
.reais { display: flex; flex-direction: column; gap: 8px; }
.reais-linha { display: grid; grid-template-columns: 92px minmax(0, 1fr) auto auto; gap: 8px; align-items: center; }
.reais-cab { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px; font-size: .8rem; color: var(--cinza); }
@media (max-width: 520px) { .reais-linha { grid-template-columns: 76px minmax(0, 1fr) auto; } .reais-linha .origem { grid-column: 2; justify-self: start; } }
.tec-grupos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 22px; }
@media (max-width: 760px) { .tec-grupos { grid-template-columns: minmax(0, 1fr); } }
.tec-g h4 { display: flex; align-items: center; gap: 7px; font-size: .86rem; color: var(--cinza); margin-bottom: 8px; }
.tec-g h4 small { margin-left: 2px; background: var(--marca-f); color: var(--link); border-radius: 999px; padding: 0 7px; font-weight: 650; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 11px; border: 1px solid var(--linha-forte); border-radius: 999px; font-size: .84rem; cursor: pointer; background: var(--superficie); user-select: none; }
.chip input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.chip .ico { width: 14px; height: 14px; display: none; }
.chip.on { background: var(--marca-f); border-color: var(--marca-b); color: var(--link); font-weight: 600; }
.chip.on .ico { display: inline; }
.chip:has(input:focus-visible) { outline: 2px solid var(--foco); outline-offset: 2px; }
.rodape-form { display: flex; justify-content: flex-end; align-items: center; gap: 12px; flex-wrap: wrap; padding: 4px 0 0; }

/* cartão de resultado ao lado do formulário */
.resumo-lado { position: sticky; top: calc(var(--topo-fixo) + 64px); display: flex; flex-direction: column; gap: 12px; }
/* no computador o cartão acompanha a rolagem e nunca passa da altura da tela: o que não couber rola dentro dele */
.cartao-res { background: var(--superficie); border: 1px solid var(--linha); border-radius: var(--raio-g); padding: 18px 18px 16px; box-shadow: var(--sombra-p);
  max-height: calc(100vh - var(--topo-fixo) - 80px); overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
.cr-saida + .cr-saida { border-top: 1px solid var(--linha-suave); margin-top: 12px; padding-top: 12px; }
.cr-topo:has(.cr-saida + .cr-saida) .cr-valor { font-size: 1.8rem; }
.cr-abrir { display: none; }
.cr-abrir .chev { transition: transform var(--dur); }
.cr-abrir[aria-expanded="true"] .chev { transform: rotate(180deg); }
.cr-resto > .regua { margin-top: 12px; max-width: 420px; }
.cr-dicas > summary { display: flex; align-items: center; gap: 8px; cursor: pointer; list-style: none; font-size: .86rem; font-weight: 600; color: var(--cinza); padding: 2px 0; border-radius: var(--raio-p); }
.cr-dicas > summary::-webkit-details-marker { display: none; }
.cr-dicas > summary:hover { color: var(--tinta); }
.cr-dicas > summary .ganho { margin-left: auto; font-weight: 700; color: var(--ok); font-size: .8rem; }
.cr-dicas > summary .chev { transition: transform var(--dur); }
.cr-dicas[open] > summary { margin-bottom: 8px; }
.cr-dicas[open] > summary .chev { transform: rotate(180deg); }
.cr-rot { font-size: .86rem; color: var(--cinza); margin: 0 0 2px; }
.cr-valor { font-size: 2.15rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1; }
.cr-num { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cr-faixa { margin: 6px 0 0; font-size: .9rem; }
.cr-faixa .mudo { font-size: .84rem; }
.cr-linha { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
.cr-conf { margin-top: 10px; }
.cr-conf small { display: block; color: var(--cinza); font-size: .8rem; margin-top: 4px; }
.cr-bloco { border-top: 1px solid var(--linha-suave); margin-top: 14px; padding-top: 12px; }
.cr-bloco h3 { font-size: .86rem; color: var(--cinza); font-weight: 600; margin: 0 0 8px; }
.cr-dois { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cr-dois div { background: var(--suave); border-radius: var(--raio-p); padding: 8px 10px; }
.cr-dois small { display: block; color: var(--cinza); font-size: .78rem; }
.cr-dois b { font-size: 1rem; }
.modos { display: flex; flex-direction: column; gap: 6px; }
.modo-op { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid var(--linha); border-radius: var(--raio-p); background: var(--superficie); cursor: pointer; }
.modo-op:hover { border-color: var(--linha-forte); }
.modo-op:has(input:checked) { border-color: var(--marca-b); background: var(--marca-f); }
.modo-op:has(input:focus-visible) { outline: 2px solid var(--foco); outline-offset: 2px; }
.modo-op.off { cursor: not-allowed; }
.modo-op.off b, .modo-op.off .mo-val { color: var(--cinza); font-weight: 550; }
.modo-op b { display: block; font-size: .9rem; }
.modo-op small { display: block; color: var(--cinza); font-size: .78rem; line-height: 1.3; }
.mo-val { font-weight: 650; font-size: .9rem; white-space: nowrap; }
.pmd { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 4px; }
.pmd li { margin: 0; }
.pmd button { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; border: 1px solid var(--linha); border-radius: var(--raio-p); background: var(--superficie); padding: 8px 10px; cursor: pointer; font-size: .88rem; }
.pmd button:hover { background: var(--suave); }
.pmd .ganho { font-weight: 700; color: var(--ok); font-size: .84rem; white-space: nowrap; }
.pmd .ico { color: var(--cinza); }
.cr-acoes { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.cr-acoes .btn { flex: 1 1 auto; }
.delta { display: inline-flex; align-items: center; gap: 2px; font-size: .78rem; font-weight: 700; color: var(--cinza); background: var(--suave); border-radius: 999px; padding: 1px 7px; white-space: nowrap; animation: some-delta 2.6s ease forwards; }
.delta .ico { width: 13px; height: 13px; }
@keyframes some-delta { 0%, 75% { opacity: 1; } 100% { opacity: 0; } }
.vazio-res { color: var(--cinza); font-size: .92rem; }
.vazio-res b { display: block; color: var(--tinta); font-size: 1.05rem; margin-bottom: 4px; }
/* área estreita: o cartão fica preso embaixo da tela, só com os valores; “Detalhes” abre o resto */
@container ws (max-width: 879px) {
  .grade-ws { display: flex; flex-direction: column; gap: 16px; }
  .resumo-lado { top: auto; bottom: 0; z-index: 15; }
  .cartao-res { max-height: none; overflow: visible; padding: 10px 14px 12px; border-radius: var(--raio-g) var(--raio-g) 0 0; box-shadow: 0 -6px 24px oklch(0.2 0.01 210 / 0.14); }
  .cr-topo { display: flex; align-items: flex-start; gap: 6px 20px; flex-wrap: wrap; }
  .cr-saida { flex: 1 1 180px; min-width: 0; }
  .cr-saida + .cr-saida { border-top: 0; margin-top: 0; padding-top: 0; }
  .cr-valor, .cr-topo:has(.cr-saida + .cr-saida) .cr-valor { font-size: 1.45rem; }
  .cr-rot { font-size: .8rem; }
  .cr-faixa { font-size: .8rem; margin-top: 2px; }
  .cr-faixa .mudo, .cr-conf small { display: none; }
  .cr-conf { margin-top: 4px; }
  .cr-abrir { display: inline-flex; align-self: center; flex: none; }
  .cartao-res:not(.aberto) .cr-resto { display: none; }
  .cartao-res.aberto .cr-resto { max-height: min(55vh, 520px); overflow-y: auto; overscroll-behavior: contain; margin-top: 8px; border-top: 1px solid var(--linha-suave); }
}
/* celular: cada valor numa linha, rótulo à esquerda e valor à direita; a faixa aparece em “Detalhes” */
@container ws (max-width: 560px) {
  .cr-topo { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
  .cr-saida { grid-column: 1; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 8px; }
  .cr-saida .cr-rot { flex: 1 1 auto; margin: 0; }
  .cr-saida .cr-num { margin-left: auto; }
  .cr-saida .cr-faixa, .cr-saida .cr-conf, .cr-saida .vazio-res { flex-basis: 100%; }
  .cr-valor, .cr-topo:has(.cr-saida + .cr-saida) .cr-valor { font-size: 1.2rem; }
  .cartao-res:not(.aberto) .cr-faixa { display: none; }
  .cr-abrir { grid-column: 2; grid-row: 1 / span 2; width: 34px; padding: 0; }
  .cr-abrir-rot { display: none; }
  .cr-abrir .chev { transform: rotate(180deg); }
  .cr-abrir[aria-expanded="true"] .chev { transform: none; }
}

/* régua: assinatura visual do Vezen (faixa provável em escala log, valor central e caminhos) */
.regua { display: block; width: 100%; height: auto; overflow: visible; }
.regua .r-eixo { stroke: var(--linha-forte); stroke-width: 2; stroke-linecap: round; }
.regua .r-faixa { fill: var(--acento-faixa); stroke: var(--acento); stroke-opacity: .35; }
.regua .r-cam { stroke: var(--cinza2); stroke-width: 1.5; }
.regua .r-cam.real { stroke: var(--real); }
.regua .r-f { stroke: var(--acento); stroke-width: 3.5; stroke-linecap: round; }
.regua text { fill: var(--cinza); font-size: 10.5px; }

/* ===================== RESULTADO ===================== */
.res-grade { display: grid; grid-template-columns: minmax(0, 1fr) 200px; gap: 28px; align-items: start; }
@media (max-width: 1180px) { .res-grade { grid-template-columns: minmax(0, 1fr); } .indice-lado { display: none; } }
.res-corpo { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.indice-lado { position: sticky; top: 72px; display: flex; flex-direction: column; gap: 2px; font-size: .86rem; }
.indice-lado b { font-size: .8rem; color: var(--cinza); font-weight: 600; padding: 0 10px 6px; }
.indice-lado button { text-align: left; background: none; border: 0; border-left: 2px solid var(--linha); padding: 5px 10px; color: var(--cinza); cursor: pointer; font: inherit; }
.indice-lado button:hover { color: var(--tinta); border-left-color: var(--marca); }
.res-sec { scroll-margin-top: 72px; }
.hero-res { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px 28px; align-items: start; }
@media (max-width: 860px) { .hero-res { grid-template-columns: minmax(0, 1fr); } }
.hero-res .cr-valor { font-size: 2.6rem; }
.hero-conf { background: var(--suave); border-radius: var(--raio); padding: 14px 16px; }
.hero-conf .conf { font-size: .9rem; }
.hero-conf p { margin: 8px 0 0; font-size: .88rem; color: var(--cinza); }
.medida { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
.medida .trilha { flex: 1; height: 8px; border-radius: 4px; background: var(--linha); overflow: hidden; }
.medida .trilha i { display: block; height: 100%; border-radius: 4px; }
.medida .trilha i.c-alta { background: var(--ok); } .medida .trilha i.c-media { background: oklch(0.75 0.14 75); } .medida .trilha i.c-baixa { background: var(--crit-forte); }
.medida b { font-size: .9rem; white-space: nowrap; }
.numeros { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0; margin-top: 18px; border-top: 1px solid var(--linha-suave); }
.numeros div { padding: 12px 14px 0 0; }
.numeros dt { font-size: .8rem; color: var(--cinza); }
.numeros dd { margin: 2px 0 0; font-weight: 650; font-size: 1.05rem; }
.numeros dd small { display: block; font-weight: 400; color: var(--cinza); font-size: .78rem; }
.cam-lista { display: flex; flex-direction: column; border: 1px solid var(--linha); border-radius: var(--raio); overflow: hidden; }
.cam-item { border-bottom: 1px solid var(--linha-suave); }
.cam-item:last-child { border-bottom: 0; }
.cam-item > summary { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(120px, 2fr) 100px 76px 18px; gap: 12px; align-items: center; padding: 10px 14px; list-style: none; }
.cam-item > summary::-webkit-details-marker { display: none; }
.cam-item > summary:hover { background: var(--hover); }
.cam-item[open] > summary { background: var(--suave); }
.cam-item .chev { transition: transform var(--dur); color: var(--cinza); }
.cam-item[open] .chev { transform: rotate(180deg); }
.cam-nome { display: flex; gap: 9px; align-items: center; min-width: 0; font-weight: 600; font-size: .92rem; }
.cam-nome small { display: block; font-weight: 400; color: var(--cinza); font-size: .78rem; }
.cam-val { text-align: right; font-weight: 650; white-space: nowrap; }
.cam-peso { display: flex; align-items: center; gap: 6px; font-size: .84rem; color: var(--cinza); justify-content: flex-end; }
.cam-peso .barrinha { width: 34px; height: 6px; border-radius: 3px; background: var(--linha); overflow: hidden; }
.cam-peso .barrinha i { display: block; height: 100%; background: var(--acento); }
.cam-corpo { padding: 4px 14px 16px 14px; }
.cam-corpo p { color: var(--cinza); font-size: .9rem; margin: 8px 0 10px; }
.cam-cab-lista { display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(120px, 2fr) 100px 76px 18px; gap: 12px; padding: 8px 14px; font-size: .78rem; color: var(--cinza); background: var(--suave); border-bottom: 1px solid var(--linha); }
@media (max-width: 760px) {
  .cam-item > summary, .cam-cab-lista { grid-template-columns: minmax(0, 1fr) auto 18px; }
  .cam-item .cam-plot, .cam-cab-lista .cp, .cam-item .cam-peso, .cam-cab-lista .cw { display: none; }
}
.cam-plot { position: relative; height: 22px; }
.cam-plot .cp-faixa { position: absolute; top: 4px; bottom: 4px; background: var(--acento-faixa); border-radius: 3px; }
.cam-plot .cp-f { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--acento); opacity: .7; }
.cam-plot .cp-linha { position: absolute; top: 50%; height: 2px; margin-top: -1px; border-radius: 1px; background: var(--mod); opacity: .55; }
.cam-plot .cp-linha.real { background: var(--real); }
.cam-plot .cp-pt { position: absolute; top: 50%; width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%; background: var(--mod); border: 2px solid var(--superficie); }
.cam-plot .cp-pt.real { background: var(--real); }
.cam-plot .cp-pt.comp { background: var(--cinza2); }
.eixo-log { position: relative; height: 18px; font-size: .74rem; color: var(--cinza); }
.eixo-log span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ic-cam { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; flex: none; }
.ic-cam.mod { background: var(--marca-f); color: var(--mod); }
.ic-cam.real { background: var(--info-f); color: var(--real); }
.ic-cam .ico { width: 16px; height: 16px; }

function ehOrgaoPublico(d) { return d.natureza === 'publico' && d.tipoPublico !== 'estatal'; }
function linhaDe(d) {
  if (ehOrgaoPublico(d)) return 'publico';
  if (d.natureza === 'terceiro') return 'terceiro';
  const f = PAIS.filtrosSetor.find(s => s.id === d.setor);

function salarioUF(uf, P) { const g = P.regional.grupos.find(g => g.ufs.includes(uf)); return g ? g.salario : null; }
function faixaEnquadramento(enq, anoRef, P) {
  const anos = P.limites.anos.slice().sort((a, b) => a.ano - b.ano);
  let lim = anos[0];
  for (const l of anos) if (anoRef >= l.ano) lim = l;
  if (enq === 'MEI') return { min: P.limites.pisoMEI, max: lim.MEI };
  if (enq === 'ME') return { min: lim.MEI, max: lim.ME };
  if (enq === 'EPP') return { min: lim.ME, max: lim.EPP };

}
function nivelDigitalAuto(d) {
  const ex = d.extras || {};
  if (d.natureza === 'startup' || d.setor === 'tecnologia') return 'alta';
  if (d.setor === 'educacao' && +ex.pctEAD > 50) return 'alta';
  if (d.setor === 'varejo' && +ex.pctOnline > 30) return 'alta';
  return 'media';
}

// inversa da normal padrão (algoritmo de Acklam): zNormal(0,25) ≈ −0,6745
function zNormal(p) {
  if (!(p > 0 && p < 1)) return NaN;
  const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
  const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
  const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const e = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];
  const cauda = q => (((((c[0] * q + c[1]) * q + c[2]) * q + c[3]) * q + c[4]) * q + c[5]) / ((((e[0] * q + e[1]) * q + e[2]) * q + e[3]) * q + 1);
  if (p < 0.02425) return cauda(Math.sqrt(-2 * Math.log(p)));
  if (p > 1 - 0.02425) return -cauda(Math.sqrt(-2 * Math.log(1 - p)));
  const q = p - 0.5, t = q * q;
  return (((((a[0] * t + a[1]) * t + a[2]) * t + a[3]) * t + a[4]) * t + a[5]) * q / (((((b[0] * t + b[1]) * t + b[2]) * t + b[3]) * t + b[4]) * t + 1);
}
// PTAX de fechamento do último dia útil de dezembro, da tabela embutida
function taxaPTAX(moeda, ano) { const t = ((PAIS.cambio.ptax || {})[moeda] || {})[ano]; return t ? { v: t[0], data: t[1] } : null; }
// média ponderada em logaritmo; rho > 0 trata os valores como correlacionados (a incerteza cai menos)
function juntarLog(es, rho) {
  const sw = es.reduce((a, e) => a + 1 / (e.s * e.s), 0);
  const lnv = es.reduce((a, e) => a + Math.log(e.v) / (e.s * e.s), 0) / sw;
  for (const e of es) e.peso = (1 / (e.s * e.s)) / sw;
  return { v: Math.exp(lnv), s: Math.sqrt((1 + rho * (es.length - 1)) / sw) };
}

/* ---------- receita líquida da operação no Brasil ---------- */
// ordem: dado oficial informado > informado combinado com a estimativa > estimativa da ferramenta > meio da faixa do enquadramento
function receitaEmpresa(d, P, c) {
  const R = P.receita, I = P.incertezas, L = c.L, ano = c.ano, sOrig = c.sOrig;
  const out = { usada: null, modo: null, informada: null, caminhos: [], estimativa: null, avisos: [], comparacao: false };
  const crescer = a => { const dt = a > 1900 && a < ano ? ano - a : 0; return { dt, f: Math.pow(1 + R.g, dt) }; };
  const fat = valorPos(d.faturamento);
  // 1. valor informado: bruta vira líquida pelas deduções do setor; valor de ano anterior é levado ao ano da estimativa
  if (fat) {
    const bruta = d.fatTipo === 'bruta' && (L.ded || 0) > 0, ded = bruta ? L.ded : 0, cr = crescer(+d.fatAno), liq = fat * (1 - ded);
    out.informada = { valor: fat, bruta, ded, liq, ano: +d.fatAno || null, dt: cr.dt, fator: cr.f, v: liq * cr.f, o: d.faturamento.o || 'terceiros',
      s: Math.sqrt(sOrig(d.faturamento.o) ** 2 + (bruta ? R.sDed ** 2 : 0) + cr.dt * I.sigmaG ** 2) };
  }
  // 2. estimativa da ferramenta, só quando pedida
  if (d.fatEstimar) {
    const nFunc = c.func ?? (c.usInf && L.u ? c.usInf / L.u : null), oF = c.func ? d.funcionarios.o : c.usInf ? d.usuarios.o : null;
    if (nFunc && L.rpe) {
      const sM = R.sFunc + (c.pequena ? I.extraPequena : 0), pF = { rot: c.func ? 'Funcionários' : 'Funcionários (usuários ÷ ' + nf(L.u, 2) + ')', val: nf(nFunc, 0) };
      let v, partes;
      if (R.beta != null) {
        // modo calibrado: curva da base de empresas; fora da faixa de tamanhos da base, o ajuste de porte para no limite
        const nAj = clamp(nFunc, R.nMin || 1, R.nMax || Infinity), fp = Math.pow(nAj / R.n0, R.beta - 1), dtR = R.anoRef && ano > R.anoRef ? ano - R.anoRef : 0, cr = Math.pow(1 + R.g, dtR);
        v = nFunc * L.rpe * fp * cr;
        partes = [pF, { op: '×', rot: 'Receita líquida por funcionário numa empresa do setor com ' + nf(R.n0, 0) + ' funcionários (base de empresas, ' + R.anoRef + ')', val: fmtRS(L.rpe) },
          { op: '×', rot: 'Ajuste de porte da base: (' + nf(nAj, 0) + ' ÷ ' + nf(R.n0, 0) + ') elevado a ' + nf(R.beta - 1, 2), val: nf(fp, 3) }]
          .concat(dtR ? [{ op: '×', rot: 'Crescimento até ' + ano, val: nf(cr, 3) }] : []);
      } else {
        const fr = c.banda ? (c.banda.fr ?? 1) : 1, dtR = R.anoRef && ano > R.anoRef ? ano - R.anoRef : 0, cr = Math.pow(1 + R.g, dtR);
        v = nFunc * L.rpe * fr * cr;
        partes = [pF, { op: '×', rot: R.anoRef ? 'Receita líquida por funcionário no setor, calibrada (' + R.anoRef + ')' : 'Receita líquida por funcionário no setor, por ano', val: fmtRS(L.rpe) },
          { op: '×', rot: 'Ajuste de porte', val: nf(fr, 3) }].concat(dtR ? [{ op: '×', rot: 'Crescimento até ' + ano, val: nf(cr, 3) }] : []);
      }
      // ajuste local da calibração (estado, cidade, setor na cidade)
      const loc = fatorLocal(R.local, c.linhaId, d.uf, d.municipio);
      if (loc) { v *= loc.f; partes.push({ op: '×', rot: 'Ajuste local da base: ' + textoLocal(loc), val: nf(loc.f, 3) }); out.local = loc; }
      out.caminhos.push({ cod: 'RF', nome: 'Pelos funcionários', v, s: Math.sqrt(sM * sM + sOrig(oF) ** 2), origem: oF || 'terceiros', partes });
    }
    if (d.natureza === 'subsidiaria' && valorPos(d.globalRec)) {
      const moeda = d.globalMoeda || 'USD', anoG = +d.globalAno || ano - 1, txInf = valorPos({ v: d.globalTaxa });
      const tab = moeda === 'BRL' || txInf ? null : taxaPTAX(moeda, anoG), tx = moeda === 'BRL' ? 1 : txInf || (tab && tab.v);
      const G = out.global = { moeda, valor: +d.globalRec.v, ano: anoG, taxa: tx || null, taxaData: tab ? tab.data : null,
        taxaFonte: moeda === 'BRL' ? 'real' : txInf ? (d.globalTaxaFonte || 'manual') : tab ? 'tabela' : null };
      if (!tx) out.avisos.push('Sem taxa de câmbio de ' + moeda + ' para ' + anoG + ': informe a taxa para usar a receita global.');
      else {
        G.vBRL = G.valor * tx;
        let share = null, sShare = 0;
        if (valorPos(d.globalPart)) { share = Math.min(1, +d.globalPart.v / 100); sShare = sOrig(d.globalPart.o); G.shareFonte = 'informada'; }
        else if (valorPos(d.globalFunc) && nFunc) {
          share = Math.min(1, nFunc / +d.globalFunc.v) * R.prodBR; G.shareFonte = 'funcionarios';
          sShare = Math.sqrt(R.sGlobal ** 2 + sOrig(oF) ** 2 + sOrig(d.globalFunc.o) ** 2);
        }
        if (share) {
          const cr = crescer(anoG);
          G.share = share; G.dt = cr.dt; G.fator = cr.f;
          out.caminhos.push({ cod: 'RG', nome: 'Pela receita global do grupo', v: G.vBRL * share * cr.f, origem: d.globalRec.o || 'terceiros',
            s: Math.sqrt(sOrig(d.globalRec.o) ** 2 + sShare * sShare + cr.dt * I.sigmaG ** 2),
            partes: [{ rot: 'Receita global em reais', val: fmtRS(G.vBRL) },
              { op: '×', rot: G.shareFonte === 'informada' ? 'Participação do Brasil informada' : 'Participação do Brasil pelos funcionários', val: fmtPct(share, 2) }]
              .concat(cr.dt ? [{ op: '×', rot: 'Crescimento até ' + ano, val: nf(cr.f, 3) }] : []) });
        } else out.avisos.push('Para usar a receita global, informe a participação do Brasil ou os funcionários no mundo.');
      }
    }
    if (c.enq) {
      const fx = faixaEnquadramento(c.enq, +d.fatAno || ano, P);
      out.faixaEnq = fx;
      out.caminhos.push({ cod: 'RE', nome: 'Pela faixa do enquadramento', v: Math.sqrt(fx.min * fx.max), s: Math.log(fx.max / fx.min) / (2 * Z90), origem: 'enquadramento',
        partes: [{ rot: 'Meio da faixa legal ' + c.enq + ' (' + fmtRS(fx.min) + ' a ' + fmtRS(fx.max) + ')', val: fmtRS(Math.sqrt(fx.min * fx.max)) }] });
    }
    if (out.caminhos.length) {
      const e = juntarLog(out.caminhos, I.rho);
      if (out.faixaEnq) e.v = clamp(e.v, out.faixaEnq.min, out.faixaEnq.max);
      e.p10 = e.v * Math.exp(-Z90 * e.s); e.p90 = e.v * Math.exp(Z90 * e.s);
      out.estimativa = e;
    } else if (!out.avisos.length) out.avisos.push(L.rpe ? 'Para estimar a receita, informe o número de funcionários' + (d.natureza === 'subsidiaria' ? ' ou a receita global do grupo' : '') + '.'
      : 'Não há receita por funcionário de referência para “' + L.nome + '”: a ferramenta não estima a receita deste tipo de organização.');
  }
  // 3. qual receita entra no cálculo: dado oficial nunca é trocado por estimativa
  const inf = out.informada, est = out.estimativa, oficial = !!inf && (inf.o === 'oficial' || inf.o === 'agregador');
  if (inf && (oficial || !est)) {
    out.usada = { v: inf.v, s: inf.s }; out.modo = 'informada';
    if (est) {
      out.comparacao = true;
      if (inf.v < est.p10 || inf.v > est.p90) out.avisos.push('A receita informada está fora da faixa estimada pela ferramenta (' + fmtRS(est.p10) + ' a ' + fmtRS(est.p90) + '). Confira se ela é da operação no Brasil e do ano informado.');
    }
  } else if (inf && est) {
    const w1 = 1 / (inf.s * inf.s), w2 = 1 / (est.s * est.s);
    out.usada = { v: Math.exp((w1 * Math.log(inf.v) + w2 * Math.log(est.v)) / (w1 + w2)), s: 1 / Math.sqrt(w1 + w2) };
    out.pesoInformada = w1 / (w1 + w2); out.modo = 'combinada';
  } else if (est) { out.usada = { v: est.v, s: est.s }; out.modo = 'estimada'; }
  else if (c.enq) { // sem receita e sem estimativa pedida: meio da faixa legal (regra das pequenas)
    const fx = out.faixaEnq = faixaEnquadramento(c.enq, +d.fatAno || ano, P);
    out.usada = { v: Math.sqrt(fx.min * fx.max), s: Math.log(fx.max / fx.min) / (2 * Z90) }; out.modo = 'enquadramento';
  }
  if (out.usada) { out.usada.p10 = out.usada.v * Math.exp(-Z90 * out.usada.s); out.usada.p90 = out.usada.v * Math.exp(Z90 * out.usada.s); }
  out.soFuncionarios = out.modo === 'estimada' && out.caminhos.every(x => x.cod === 'RF');
  return out;
}

/* ---------- cálculo principal ---------- */
function calcular(d, P, opts = {}) {
  const ano = opts.ano ?? new Date().getFullYear();
  const calib = opts.semCalib ? null : (opts.calib || null);
  const sOrig = o => P.origens[o] ?? P.origens.terceiros;
  const I = P.incertezas;
  const linhaId = linhaDe(d), L = P.setores[linhaId];
  const r = { ano, linhaId, linha: L, ests: [], avisos: [], vazio: false };

  const fat = valorPos(d.faturamento), func = valorPos(d.funcionarios), usInf = valorPos(d.usuarios), prof = valorPos(d.profTI);
  const adic = d.natureza === 'listada' ? valorPos(d.adicoes) : null;
  const contr = d.natureza === 'publico' ? valorPos(d.contratos) : null;
  const decl = valorPos(d.gastoDeclarado);
  const enq = ENQUADRAMENTOS.includes(d.enquadramento) ? d.enquadramento : null;
  const reais = (d.gastosReais || []).filter(x => valorPos(x) && +x.ano > 1900)
    .map(x => ({ ano: +x.ano, v: +x.v, o: x.o })).sort((a, b) => a.ano - b.ano);
  const crescF = valorNum(d.crescFunc);

  // usuários, porte, região
  const usuarios = usInf ?? (func ? func * L.u : null);
  const usuariosOrig = usInf ? d.usuarios.o : (func ? d.funcionarios.o : null);
  const pequena = !!enq || (usuarios != null && usuarios < 50);
  const banda = usuarios != null ? P.porte.find(b => b.ate == null || usuarios <= b.ate) : (pequena ? P.porte[0] : null);
  const f1 = banda ? banda.f1 : 1, f2 = banda ? banda.f2 : 1;
  const sal = salarioUF(d.uf, P);
  const Iuf = sal ? sal / P.regional.mediaNacional : 1;
  const Ief = 1 + 0.5 * (Iuf - 1);
  Object.assign(r, { usuarios, pequena, f1, f2, Iuf, Ief, enq });

  // modificadores
  const Mo = P.modificadores, mods = [];
  const digital = d.digital || nivelDigitalAuto(d);
  const NIVEL = { baixa: 'baixa', media: 'média', alta: 'alta' };
  mods.push({ tipo: 'digital', auto: !d.digital, nome: 'Intensidade digital ' + NIVEL[digital] + (d.digital ? '' : ' (automática)'), v: Mo.digital[digital] ?? 1 });
  if (d.natureza === 'subsidiaria' && d.tiMatriz === 'matriz') mods.push({ tipo: 'matriz', nome: 'TI gerida na matriz', v: Mo.tiMatriz });
  const un = valorPos(d.unidades);
  if (un) { let v = 1; for (const b of Mo.unidades) if (un >= b.de) v = b.v; mods.push({ tipo: 'unidades', nome: 'Nº de unidades: ' + nf(un, 0), v }); }
  if (crescF != null && crescF > Mo.crescimentoLimiar) mods.push({ tipo: 'crescimento', nome: 'Crescimento de funcionários acima de ' + Mo.crescimentoLimiar + '%', v: Mo.crescimentoFator });
  const Mmod = clamp(mods.reduce((a, m) => a * m.v, 1), Mo.mMin, Mo.mMax);
  Object.assign(r, { mods, Mmod, digital });

  // crescimento
  const C = P.crescimento;
  let g = C.gSetor, gFonte = 'media';
  const anosDist = [...new Set(reais.map(x => x.ano))];
  if (d.gManual !== '' && d.gManual != null && isFinite(+d.gManual)) { g = +d.gManual / 100; gFonte = 'manual'; }
  else if (anosDist.length >= 2) {
    const ult = {}; for (const x of reais) ult[x.ano] = x;
    const a0 = Math.min(...anosDist), a1 = Math.max(...anosDist);
    g = clamp(Math.pow(ult[a1].v / ult[a0].v, 1 / (a1 - a0)) - 1, C.histMin, C.histMax); gFonte = 'historico';
  } else if (crescF != null) { g = clamp(C.gSetor + crescF / 100, C.funcMin, C.funcMax); gFonte = 'funcionarios'; }
  Object.assign(r, { g, gFonte });

  const est = (cod, nome, v, sMod, sIn, formula, extra = {}) => {
    const s = Math.sqrt(sMod * sMod + sIn * sIn);
    const e = Object.assign({ cod, nome, v, s, sMod, sIn, formula }, extra);
    r.ests.push(e); return e;
  };

  // E1: receita líquida (informada, estimada pela ferramenta ou pelo enquadramento)
  const rec = receitaEmpresa(d, P, { ano, L, linhaId, func, usInf, pequena, enq, banda, sOrig });
  const e2Ativo = usuarios != null && usuarios >= 50 && L.capu != null && !pequena;
  rec.e1Fora = rec.soFuncionarios && e2Ativo && L.p != null; // estimada só pelos funcionários: o E2 já usa esse dado
  r.receita = rec;
  let E1 = null;
  if (rec.usada && L.p != null && !rec.e1Fora) {
    const u = rec.usada, sMod = L.sE1 + (pequena ? I.extraPequena : 0);
    const v = u.v * L.p * f1 * Mmod;
    const rotRec = { informada: 'Receita líquida', enquadramento: 'Receita estimada pelo enquadramento ' + enq, estimada: 'Receita líquida estimada pela ferramenta', combinada: 'Receita líquida (informada e estimada)' }[rec.modo];
    E1 = est('E1', 'Pela receita', v, sMod, u.s,
      fmtRS(u.v) + (rec.modo === 'enquadramento' ? ' (meio da faixa ' + enq + ')' : '') + ' × ' + fmtPct(L.p) + ' × ' + nf(f1, 2) + ' × ' + nf(Mmod, 2), {
        modelo: true, origem: rec.modo === 'informada' ? rec.informada.o : rec.modo === 'enquadramento' ? 'enquadramento' : 'estimado',
        partes: [{ rot: rotRec, val: fmtRS(u.v) },
          { op: '×', rot: '% da receita gasto com TI no setor', val: fmtPct(L.p) },
          { op: '×', rot: 'Ajuste de porte', val: nf(f1, 2) },
          { op: '×', rot: 'Ajustes da empresa', val: nf(Mmod, 2) }]
      });
  }
  r.fatUsado = rec.usada ? rec.usada.v : null; r.viaEnq = rec.modo === 'enquadramento'; if (rec.faixaEnq) r.faixaEnq = rec.faixaEnq;

  // E2
  let E2 = null;
  if (usuarios != null && usuarios >= 50 && L.capu != null && !pequena) {
    const v = usuarios * L.capu * f2 * Ief * Mmod;
    E2 = est('E2', 'Pelo número de usuários', v, L.sE2, sOrig(usuariosOrig),
      nf(usuarios, 0) + ' usuários × ' + fmtRS(L.capu) + ' × ' + nf(f2, 3) + ' × ' + nf(Ief, 3) + ' × ' + nf(Mmod, 2), {
        modelo: true, origem: usuariosOrig || 'terceiros',
        partes: [{ rot: usInf ? 'Usuários de computador' : 'Usuários (funcionários × ' + nf(L.u, 2) + ')', val: nf(usuarios, 0) },
          { op: '×', rot: 'Gasto por usuário no setor, por ano', val: fmtRS(L.capu) },
          { op: '×', rot: 'Ajuste de porte', val: nf(f2, 3) },
          { op: '×', rot: 'Ajuste regional' + (d.uf ? ' (' + d.uf + ')' : ''), val: nf(Ief, 3) },
          { op: '×', rot: 'Ajustes da empresa', val: nf(Mmod, 2) }]
      });
  }

  // E3
  let E3 = null, custoEquipe = null;
  const sp = pequena ? P.equipe.sPessoalPequena : P.equipe.sPessoal;
  if (prof) {
    const salUso = valorPos(d.salarioTI) ?? sal ?? P.regional.mediaNacional;
    custoEquipe = prof * salUso * 12 * P.equipe.fatorCLT;
    E3 = est('E3', 'Pela equipe de TI', custoEquipe / sp, I.sE3, sOrig(d.profTI.o),
      nf(prof, 0) + ' profissionais × ' + fmtRS(salUso) + ' × 12 × ' + nf(P.equipe.fatorCLT, 1) + ' ÷ ' + nf(sp, 2), {
        modelo: true, origem: d.profTI.o || 'terceiros',
        partes: [{ rot: 'Profissionais de TI', val: nf(prof, 0) },
          { op: '×', rot: valorPos(d.salarioTI) ? 'Salário médio informado, por mês' : 'Salário médio de TI ' + (sal ? 'em ' + d.uf : 'no Brasil') + ', por mês', val: fmtRS(salUso) },
          { op: '×', rot: 'Meses', val: '12' },
          { op: '×', rot: 'Custo total ÷ salário (encargos)', val: nf(P.equipe.fatorCLT, 1) },
          { op: '÷', rot: 'Parte da equipe no gasto de TI', val: fmtPct(sp, 0) }]
      });
  }
  r.custoEquipe = custoEquipe;

  // E5
  let E5 = null;
  if (adic) {
    const sc = linhaId === 'bancos' ? P.equipe.sCapexBancos : P.equipe.sCapex;
    E5 = est('E5', 'Pelos investimentos no balanço', adic / sc, I.sE5, sOrig(d.adicoes.o),
      fmtRS(adic) + ' ÷ ' + nf(sc, 2), {
        modelo: true, origem: d.adicoes.o || 'terceiros',
        partes: [{ rot: 'Adições do ano em software e equipamentos', val: fmtRS(adic) },
          { op: '÷', rot: 'Parte do investimento no gasto de TI', val: fmtPct(sc, 0) }]
      });
  }

  // E4p
  let E4p = null;
  if (contr) {
    const v = E3 ? contr + custoEquipe : contr / (1 - sp);
    E4p = est('E4p', 'Pelos contratos de TI', v, I.sE4p, sOrig(d.contratos.o),
      E3 ? fmtRS(contr) + ' + equipe ' + fmtRS(custoEquipe) : fmtRS(contr) + ' ÷ (1 − ' + nf(sp, 2) + ')', {
        origem: d.contratos.o || 'terceiros',

/* ---------- próximo melhor dado (5.6) ---------- */
const CAMPOS_PMD = [
  { id: 'gastoDeclarado', rot: 'Informe o gasto de TI declarado do ano' },
  { id: 'gastoReal', rot: 'Informe o gasto real do ano anterior' },
  { id: 'faturamento', rot: 'Informe a receita líquida' },
  { id: 'funcionarios', rot: 'Informe o nº de funcionários' },
  { id: 'profTI', rot: 'Informe os profissionais de TI internos' },
  { id: 'adicoes', rot: 'Informe as adições em software e equipamentos' }

function proximoMelhorDado(d, P, opts, res) {
  const ano = opts.ano ?? new Date().getFullYear();
  const base = res && !res.vazio ? res.ic : 0;
  const Fref = res && !res.vazio ? res.F : 1e6;
  const ofi = v => ({ v, o: 'oficial' });

  const escala = (campo, cod) => { // valor que reproduz F (estimador linear no dado)
    const r1 = sim(c => { c[campo] = ofi(1000); });
    const e = r1.ests.find(x => x.cod === cod);
    return e ? 1000 * Fref / e.v : null;
  };
  const out = [];
  for (const cp of CAMPOS_PMD) {
    let r2 = null;
    if (cp.id === 'gastoDeclarado') { if (valorPos(d.gastoDeclarado)) continue; r2 = sim(c => { c.gastoDeclarado = ofi(Fref); }); }
    else if (cp.id === 'gastoReal') {
      if ((d.gastosReais || []).some(x => valorPos(x))) continue;
      const g = res && !res.vazio ? res.g : P.crescimento.gSetor;
      r2 = sim(c => { c.gastosReais = [{ ano: ano - 1, v: Fref / (1 + g), o: 'oficial' }]; });
    }
    else if (cp.id === 'faturamento') { if (valorPos(d.faturamento)) continue; const v = escala('faturamento', 'E1'); if (!v) continue; r2 = sim(c => { c.faturamento = ofi(v); }); }

      for (let i = 0; i < 3; i++) { const rr = sim(c => { c.funcionarios = ofi(v); }); const e = rr.ests.find(x => x.cod === 'E2'); if (!e) break; v = v * Fref / e.v; }

    if (!r2 || r2.vazio) continue;

}

/* ---------- calibração (8) ---------- */
function calibrar(empresas, P, opts = {}) {

    const d = emp.dados;
    const reais = (d.gastosReais || []).filter(x => valorPos(x) && +x.ano > 1900).sort((a, b) => a.ano - b.ano);
    if (!reais.length) continue;
    const u = reais[reais.length - 1];
    const c = copiar(d); c.gastosReais = []; c.gastoDeclarado = null; c.contratos = null;
    const res = calcular(c, P, { ano, semCalib: true });

    if (res.vazio || !res.modelo) { linhas.push({ emp, ano: +u.ano, R: +u.v, semModelo: true, excluida }); continue; }
    const My = res.modelo.vBruto / Math.pow(1 + P.crescimento.gSetor, ano - u.ano);

  }

  // pequena: abaixo de 1/5 ou acima de 5 vezes a mediana (com menos de 3 empresas, do próprio modelo), e a pessoa pode confirmar o valor
  const ok = linhas.filter(l => !l.semModelo && !l.excluida);

  const ks = {}, nS = {};

  for (const l of val) (porSetor[l.linhaId] = porSetor[l.linhaId] || []).push(l.r);
  // setor com menos de minGrupo empresas fica com a correção geral (o valor dele seria o dado de poucas empresas)
  for (const s in porSetor) { const n = porSetor[s].length; nS[s] = n; ks[s] = n >= minG ? (n * mediana(porSetor[s]) + C.K * kg) / (n + C.K) : kg; }

  const local = ajustesLocais(val.map((l, i) => { const d = l.emp.dados; return { uf: d.uf || null, cid: chaveCidade(d.uf, d.municipio), nome: municipioOficial(d.uf, d.municipio) || d.municipio, linha: l.linhaId, e: res[i] }; }), C);
  for (const l of val) {

  return out;
}

  const linhas = itens.map(x => `<div class="cam-item"><div style="display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(120px,2fr) 100px 76px;gap:12px;align-items:center;padding:10px 14px" title="${esc(`${x.nome}: ${fmtRS(x.c.v)}`)}">
    <span class="cam-nome"><span class="ic-cam ${x.tipo === 'real' ? 'real' : 'mod'}">${ico(x.i)}</span><span>${esc(x.nome)}<small>${esc(x.sub)}</small></span></span>${plotCaminho(x.c, x.tipo, X, faixa)}<span class="cam-val">${fmtRS(x.c.v)}</span>${pesoHtml(x.peso)}</div></div>`).join('');
  return `<div class="cam-lista">${linhas}<div style="display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(120px,2fr) 100px 76px;gap:12px;padding:4px 14px 8px"><span></span><div class="eixo-log">${eixoCaminhos(lo, hi, X)}</div></div></div>
  ${tabelaDados(['Caminho', 'Receita', 'Faixa', 'Peso'], itens.map(x => { const [a, b] = limitesCaminho(x.c); return [esc(x.nome), fmtRS(x.c.v), fmtRS(a) + ' a ' + fmtRS(b), x.peso == null ? '—' : Math.round(x.peso * 100) + '%']; }))}`;
}

/* geral e conservadora em barras empilhadas: sem salários + equipe interna = total */
function graficoEstimativas(r) {

  const linha = (i, rot, sub, tot, sem) => {

      <div class="hb-val">${fmtRS(v)}${rec ? `<small>${fmtPct(v / rec.v)} da receita</small>` : ''}<small>${com ? 'sem' : 'com'} salários de TI: ${fmtRS(com ? sem : tot)}</small></div>`;

}

/* curva da faixa provável: 8 em 10 casos entre P10 e P90 */
function graficoFaixa(r, W) {
  const s = r.sigmaFinal, lF = Math.log(r.F), H = 190, m = { l: 12, r: 12, t: 36, b: 34 };
  const a = lF - 3.1 * s, b = lF + 3.1 * s, X = lv => m.l + (lv - a) / (b - a) * (W - m.l - m.r);
  const dens = lv => Math.exp(-0.5 * Math.pow((lv - lF) / s, 2)), Y = q => H - m.b - q * (H - m.t - m.b);
  const pts = []; for (let i = 0; i <= 140; i++) { const lv = a + (b - a) * i / 140; pts.push([X(lv), Y(dens(lv)), lv]); }
  const l10 = Math.log(r.p10), l90 = Math.log(r.p90), base = H - m.b;
  const caminho = ps => ps.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join('');
  const dentro = pts.filter(p => p[2] >= l10 && p[2] <= l90);
  const area = `M${X(a)},${base}` + pts.map(p => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('') + `L${X(b)},${base}Z`;
  const areaIn = `M${X(l10)},${base}L${X(l10)},${Y(dens(l10)).toFixed(1)}` + dentro.map(p => `L${p[0].toFixed(1)},${p[1].toFixed(1)}`).join('') + `L${X(l90)},${Y(dens(l90)).toFixed(1)}L${X(l90)},${base}Z`;
  const marca = (lv, rot, val, forte) => `<line x1="${X(lv)}" x2="${X(lv)}" y1="${forte ? m.t - 8 : Y(dens(lv))}" y2="${base}" stroke="${forte ? 'var(--acento)' : 'var(--cinza2)'}" stroke-width="${forte ? 2 : 1}"/><text x="${X(lv)}" y="${forte ? m.t - 14 : Y(dens(lv)) - 8}" text-anchor="middle">${rot}</text><text x="${X(lv)}" y="${base + 18}" text-anchor="middle" font-weight="${forte ? 700 : 600}" style="fill:var(--tinta)">${val}</text>`;
  const cauda = W >= 420 ? `<text x="${X(l10) - 8}" y="${base - 8}" text-anchor="end">1 em 10 abaixo</text><text x="${X(l90) + 8}" y="${base - 8}">1 em 10 acima</text>` : '';
  return `<div class="graf"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Faixa provável: 8 em 10 casos entre ${fmtRS(r.p10)} e ${fmtRS(r.p90)}; valor central ${fmtRS(r.F)}">
    <line x1="${m.l}" x2="${W - m.r}" y1="${base}" y2="${base}" class="eixo"/>
    <path d="${area}" fill="var(--suave)"/><path d="${areaIn}" fill="var(--acento-faixa)"/>
    <path d="${caminho(pts)}" fill="none" stroke="var(--acento)" stroke-width="2"/>
    ${marca(l10, 'P10', fmtRS(r.p10))}${marca(l90, 'P90', fmtRS(r.p90))}${marca(lF, 'Valor central', fmtRS(r.F), true)}${cauda}
  </svg></div>`;
}

/* ajustes: para a direita aumentam, para a esquerda diminuem (escala de ÷2 a ×2) */
function graficoAjustes(r, d) {
  const usaE1 = r.ests.some(e => e.cod === 'E1'), usaE2 = r.ests.some(e => e.cod === 'E2'), Mo = P().modificadores, ls = [];
  if (usaE1) ls.push(['porte', 'Porte, no cálculo pela receita', r.f1]);
  if (usaE2) { ls.push(['porte', 'Porte, no cálculo por usuários', r.f2]); ls.push(['empresas', 'Região' + (d.uf ? ' (' + d.uf + ')' : ', sem UF'), r.Ief]); }
  const mods = (usaE1 || usaE2) ? r.mods : [];
  for (const m of mods) ls.push([{ digital: 'sinal', matriz: 'grupo', unidades: 'empresas', crescimento: 'sobe' }[m.tipo] || 'ajuste', m.nome, m.v]);
  const tabela = `<details class="dados-tab"><summary>Ver a explicação de cada ajuste</summary><div style="margin-top:10px">${tabelaAjustes(r, d)}</div></details>`;
  if (!ls.length) return '<p class="mudo">Sem ajustes: os caminhos usados não dependem de médias de mercado.</p>' + tabela;
  const pos = v => clamp(Math.log(v) / Math.log(2), -1, 1) * 50;
  const barra = (v, cls = '') => { const p = pos(v); return Math.abs(p) < 0.4 ? '' : p > 0 ? `<span class="hb-b dir ${cls}" style="left:50%;width:${p}%"></span>` : `<span class="hb-b esq ${cls}" style="left:${50 + p}%;width:${-p}%"></span>`; };
  const pct = v => Math.abs(v - 1) < 0.005 ? 'sem efeito' : (v > 1 ? '+' : '−') + nf(Math.abs(v - 1) * 100, 0) + '%';
  const linha = ([i, nome, v], tot) => `<div class="hb-rot">${ico(i)}<span>${tot ? '<b>' + esc(nome) + '</b>' : esc(nome)}</span></div><div class="hb-trilha meio" data-tip="${esc(nome + ': × ' + nf(v, 3))}">${barra(v, tot ? 'total' : '')}</div><div class="hb-val">× ${nf(v, 2)}<small>${pct(v)}</small></div>`;
  return `<div class="hbar">${ls.map(x => linha(x)).join('')}${mods.length ? '<div class="fo-linha-sep"></div>' + linha(['ajuste', 'Total dos ajustes da empresa', r.Mmod], true) : ''}
    <span></span><div class="hb-eixo"><span>÷ 2</span><span>sem efeito</span><span>× 2</span></div><span></span></div>
    ${mods.length ? `<p class="mudo" style="font-size:.84rem;margin-top:10px">O total junta os ajustes da empresa (sem porte e região) e fica entre × ${nf(Mo.mMin, 1)} e × ${nf(Mo.mMax, 1)}.</p>` : ''}${tabela}`;
}
